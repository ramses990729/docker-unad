# This is a basic workflow to help you get started with Actions

name: Test Docker on Windows

# Controls when the workflow will run
on: 
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Switch to Linux containers
        run: |
          & "C:\Program Files\Docker\Docker\DockerCli.exe" -SwitchLinuxEngine
        shell: pwsh
        
      # Runs a single command using the runners shell
      - name: Start Docker compose
        run: docker compose up -d

      # Runs a set of commands using the runners shell
      - name: Wait for pgAdmin
        run: |
          TIMEOUT=60
          ELAPSED=0
          until curl -s http://localhost:5050 > /dev/null; do
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout esperando pgAdmin"
              docker compose logs
              exit 1
            fi
          done
          echo "pgAdmin listo!"

      - name: Verify pgAdmin responds
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5050)
          echo "HTTP Status: $STATUS"
          if [ $STATUS -ne 200 ]; then exit 1; fi
